<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>古见今遇 · 方案一 · 时空之门</title>
  <rect width="400" height="400" fill="#0A0A0A"/>
  <!-- 外圆（古·循环） -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#C9A84C" stroke-width="1.2"/>
  <!-- 内方（今·秩序） -->
  <rect x="105" y="105" width="190" height="190" fill="none" stroke="#C9A84C" stroke-width="1.2"/>
  <!-- 对角线交汇（见·遇） -->
  <line x1="105" y1="105" x2="295" y2="295" stroke="#C9A84C" stroke-width="0.6" opacity="0.5"/>
  <line x1="295" y1="105" x2="105" y2="295" stroke="#C9A84C" stroke-width="0.6" opacity="0.5"/>
  <!-- 中宫朱点 — 古今相遇的原点 -->
  <circle cx="200" cy="200" r="8" fill="#C03A2B"/>
  <!-- 四向短刻度（四字暗示） -->
  <line x1="200" y1="60" x2="200" y2="72" stroke="#C9A84C" stroke-width="1.2"/>
  <line x1="200" y1="328" x2="200" y2="340" stroke="#C9A84C" stroke-width="1.2"/>
  <line x1="60" y1="200" x2="72" y2="200" stroke="#C9A84C" stroke-width="1.2"/>
  <line x1="328" y1="200" x2="340" y2="200" stroke="#C9A84C" stroke-width="1.2"/>
</svg>
