<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>古见今遇 · 方案一 · 圆印</title>
  <desc>外圆内四字，极简印章形态</desc>
  <rect width="400" height="400" fill="#FAFAFA"/>
  <!-- 外圆 -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#1A1A1A" stroke-width="6"/>
  <!-- 十字分隔 -->
  <line x1="200" y1="60" x2="200" y2="340" stroke="#1A1A1A" stroke-width="1.5" opacity="0.3"/>
  <line x1="60" y1="200" x2="340" y2="200" stroke="#1A1A1A" stroke-width="1.5" opacity="0.3"/>
  <!-- 四字 -->
  <text x="140" y="165" font-family="Songti SC, Noto Serif SC, serif" font-size="52" font-weight="700" fill="#1A1A1A" text-anchor="middle">古</text>
  <text x="260" y="165" font-family="Songti SC, Noto Serif SC, serif" font-size="52" font-weight="700" fill="#1A1A1A" text-anchor="middle">见</text>
  <text x="140" y="265" font-family="Songti SC, Noto Serif SC, serif" font-size="52" font-weight="700" fill="#1A1A1A" text-anchor="middle">今</text>
  <text x="260" y="265" font-family="Songti SC, Noto Serif SC, serif" font-size="52" font-weight="700" fill="#1A1A1A" text-anchor="middle">遇</text>
  <!-- 中心点 -->
  <circle cx="200" cy="200" r="5" fill="#C03A2B"/>
</svg>
