<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>古见今遇 · 方案三 · 半弧相遇</title>
  <rect width="400" height="400" fill="#FFFFFF"/>
  <!-- 左半弧（古·过去） -->
  <path d="M 200 60 A 140 140 0 0 0 200 340" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <!-- 右半弧（今·未来）略偏移，形成"遇" -->
  <path d="M 210 60 A 140 140 0 0 1 210 340" fill="none" stroke="#C03A2B" stroke-width="6" stroke-linecap="round"/>
  <!-- 交汇点上下两颗圆点 -->
  <circle cx="205" cy="60" r="5" fill="#1A1A1A"/>
  <circle cx="205" cy="340" r="5" fill="#C03A2B"/>
</svg>
