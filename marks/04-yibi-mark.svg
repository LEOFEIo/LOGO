<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>古见今遇 · 方案四 · 一笔贯通</title>
  <rect width="400" height="400" fill="#0A0A0A"/>
  <!-- 一笔曲线：从左下（古）到右上（今），一气呵成 -->
  <path d="M 60 340 C 100 280, 140 120, 200 200 S 300 80, 340 60"
        fill="none" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
  <!-- 起笔顿点（古） -->
  <circle cx="60" cy="340" r="10" fill="#C9A84C"/>
  <!-- 收笔飞白（今） -->
  <line x1="340" y1="60" x2="360" y2="44" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="340" y1="60" x2="356" y2="52" stroke="#C9A84C" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- 中段遇见点 -->
  <circle cx="200" cy="200" r="6" fill="#C03A2B"/>
</svg>
