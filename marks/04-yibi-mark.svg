<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>古见今遇 · 方案四 · 竖排古风</title>
  <desc>四字竖排，右侧落款小字，传统竖排书法布局</desc>
  <rect width="400" height="400" fill="#FAFAFA"/>
  <!-- 竖排四字 -->
  <text x="200" y="100" font-family="Songti SC, Noto Serif SC, serif" font-size="54" font-weight="700" fill="#1A1A1A" text-anchor="middle">古</text>
  <text x="200" y="170" font-family="Songti SC, Noto Serif SC, serif" font-size="54" font-weight="700" fill="#1A1A1A" text-anchor="middle">见</text>
  <text x="200" y="240" font-family="Songti SC, Noto Serif SC, serif" font-size="54" font-weight="700" fill="#1A1A1A" text-anchor="middle">今</text>
  <text x="200" y="310" font-family="Songti SC, Noto Serif SC, serif" font-size="54" font-weight="700" fill="#1A1A1A" text-anchor="middle">遇</text>
  <!-- 右侧竖线 -->
  <line x1="250" y1="80" x2="250" y2="320" stroke="#C03A2B" stroke-width="1.2"/>
  <!-- 右侧落款 -->
  <text x="268" y="140" font-family="Songti SC, Noto Serif SC, serif" font-size="11" fill="#1A1A1A" opacity="0.6" writing-mode="vertical-rl">数字文化</text>
  <!-- 底部朱印小方块 -->
  <rect x="258" y="280" width="22" height="22" fill="#C03A2B" rx="2"/>
  <text x="269" y="296" font-family="Songti SC, Noto Serif SC, serif" font-size="12" fill="#FAFAFA" text-anchor="middle">遇</text>
</svg>
