<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>古见今遇 · 方案二 · 经纬交织</title>
  <rect width="400" height="400" fill="#F5F0E6"/>
  <!-- 四条横线（经·古） -->
  <line x1="80" y1="120" x2="320" y2="120" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="80" y1="173" x2="320" y2="173" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="80" y1="227" x2="320" y2="227" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="80" y1="280" x2="320" y2="280" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- 四条竖线（纬·今） -->
  <line x1="120" y1="80" x2="120" y2="320" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="173" y1="80" x2="173" y2="320" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="227" y1="80" x2="227" y2="320" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="280" y1="80" x2="280" y2="320" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- 中宫断开留白，置入朱点（遇） -->
  <rect x="168" y="168" width="64" height="64" fill="#F5F0E6"/>
  <circle cx="200" cy="200" r="12" fill="#C03A2B"/>
</svg>
