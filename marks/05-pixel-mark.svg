<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>古见今遇 · 方案五 · 四象限</title>
  <rect width="400" height="400" fill="#FFFFFF"/>
  <!-- 四个象限色块（古·见·今·遇） -->
  <!-- 左上 -->
  <rect x="40" y="40" width="150" height="150" fill="#1A1A1A"/>
  <!-- 右上 -->
  <rect x="210" y="40" width="150" height="150" fill="#C03A2B"/>
  <!-- 左下 -->
  <rect x="40" y="210" width="150" height="150" fill="#C9A84C"/>
  <!-- 右下 -->
  <rect x="210" y="210" width="150" height="150" fill="#1A1A1A"/>
  <!-- 中心留白圆（交汇·遇见） -->
  <circle cx="200" cy="200" r="28" fill="#FFFFFF"/>
  <circle cx="200" cy="200" r="6" fill="#C03A2B"/>
</svg>
